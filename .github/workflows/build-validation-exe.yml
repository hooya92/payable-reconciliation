name: Build Windows Release EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-validation-exe.yml"
      - "app.py"
      - "application/**"
      - "domain/**"
      - "adapters/excel/**"
      - "requirements.txt"
      - "assets/**"

concurrency:
  group: stable-release-publish
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Run tests on Windows
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon "assets/app.ico" --add-data "assets/app.ico;assets" --name "명세서대사" app.py
          Copy-Item "dist/명세서대사.exe" "dist/statement-reconciliation.exe"

      - name: Verify Windows Explorer file icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "dist/statement-reconciliation.exe").Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "EXE file icon could not be extracted" }
          $bitmap = $icon.ToBitmap()
          $pinkPixels = 0
          for ($y = 0; $y -lt $bitmap.Height; $y++) {
            for ($x = 0; $x -lt $bitmap.Width; $x++) {
              $pixel = $bitmap.GetPixel($x, $y)
              if ($pixel.A -gt 200 -and $pixel.R -gt ($pixel.G + 15) -and $pixel.R -gt ($pixel.B + 10)) {
                $pinkPixels++
              }
            }
          }
          if ($pinkPixels -lt ($bitmap.Width * $bitmap.Height * 0.1)) {
            throw "Extracted file icon is not the expected pink rabbit icon"
          }
          $bitmap.Save("dist/verified-file-icon.png")
          $bitmap.Dispose()
          $icon.Dispose()

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/statement-reconciliation.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  statement-reconciliation.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Verify release files
        shell: pwsh
        run: |
          $exe = "dist/statement-reconciliation.exe"
          if (-not (Test-Path $exe)) {
            throw "Release EXE was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "Release EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built $exe ($size bytes)"

      - name: Attest release EXE provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/statement-reconciliation.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: statement-reconciliation-windows
          path: |
            dist/statement-reconciliation.exe
            dist/SHA256SUMS.txt
            dist/verified-file-icon.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "download-latest"
          $assets = @("dist/statement-reconciliation.exe", "dist/SHA256SUMS.txt")
          $notes = "Windows 실행파일 최신 배포본입니다. Build: $env:GITHUB_SHA. SHA256SUMS.txt로 무결성을 확인하세요."
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Stable asset upload failed" }
            gh release edit $tag --title "명세서 대사 최신 버전" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag @assets --target "$env:GITHUB_SHA" --title "명세서 대사 최신 버전" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Stable release publish failed" }
