name: Build Windows Release EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-validation-exe.yml"
      - "app.py"
      - "application/**"
      - "domain/**"
      - "adapters/excel/**"
      - "requirements.txt"
      - "assets/**"
      - "docs/사용설명서.txt"

concurrency:
  group: stable-release-publish
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Run tests on Windows
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon "assets/app.ico" --add-data "assets/app.ico;assets" --name "PayableRecon" app.py
          Copy-Item "dist/PayableRecon.exe" "dist/statement-reconciliation.exe"

      - name: Verify Windows Explorer file icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "dist/PayableRecon.exe").Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "EXE file icon could not be extracted" }
          $bitmap = $icon.ToBitmap()
          $pinkPixels = 0
          for ($y = 0; $y -lt $bitmap.Height; $y++) {
            for ($x = 0; $x -lt $bitmap.Width; $x++) {
              $pixel = $bitmap.GetPixel($x, $y)
              if ($pixel.A -gt 200 -and $pixel.R -gt ($pixel.G + 15) -and $pixel.R -gt ($pixel.B + 10)) {
                $pinkPixels++
              }
            }
          }
          if ($pinkPixels -lt ($bitmap.Width * $bitmap.Height * 0.1)) {
            throw "Extracted file icon is not the expected pink rabbit icon"
          }
          $bitmap.Save("dist/verified-file-icon.png")
          $bitmap.Dispose()
          $icon.Dispose()

      - name: Package EXE and Korean user guide
        shell: pwsh
        run: |
          $manual = [System.IO.File]::ReadAllText((Resolve-Path "docs/사용설명서.txt"), [System.Text.Encoding]::UTF8)
          $manual = $manual -replace '\r?\n', "`r`n"
          $encoding = [System.Text.UTF8Encoding]::new($true)
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/사용설명서.txt"), $manual, $encoding)
          Compress-Archive -LiteralPath @("dist/PayableRecon.exe", "dist/사용설명서.txt") -DestinationPath "dist/PayableRecon.zip" -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/PayableRecon.zip"))
          try {
            if ($archive.Entries.Count -ne 2) { throw "Release ZIP must contain the EXE and user guide" }
            foreach ($name in @("PayableRecon.exe", "사용설명서.txt")) {
              $entry = $archive.GetEntry($name)
              if ($null -eq $entry -or $entry.Length -ne (Get-Item "dist/$name").Length) {
                throw "Release ZIP entry is missing or incomplete: $name"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $checksums = foreach ($name in @("PayableRecon.exe", "PayableRecon.zip", "사용설명서.txt", "statement-reconciliation.exe")) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Verify release files
        shell: pwsh
        run: |
          $exe = "dist/statement-reconciliation.exe"
          if (-not (Test-Path $exe)) {
            throw "Release EXE was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "Release EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built $exe ($size bytes)"

      - name: Attest release EXE provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PayableRecon.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: statement-reconciliation-windows
          path: |
            dist/PayableRecon.exe
            dist/PayableRecon.zip
            dist/사용설명서.txt
            dist/statement-reconciliation.exe
            dist/SHA256SUMS.txt
            dist/verified-file-icon.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "download-latest"
          $assets = @("dist/PayableRecon.exe", "dist/PayableRecon.zip", "dist/사용설명서.txt", "dist/statement-reconciliation.exe", "dist/SHA256SUMS.txt")
          $notes = "PayableRecon 정식 배포본입니다. PayableRecon.zip에는 PayableRecon.exe와 사용설명서.txt가 들어 있습니다. 압축을 풀고 실행하세요. 개별 파일도 다운로드할 수 있습니다. Build: $env:GITHUB_SHA. SHA256SUMS.txt로 무결성을 확인하세요."
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Stable asset upload failed" }
            gh release edit $tag --title "PayableRecon · 정식 배포" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag @assets --target "$env:GITHUB_SHA" --title "PayableRecon · 정식 배포" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Stable release publish failed" }
