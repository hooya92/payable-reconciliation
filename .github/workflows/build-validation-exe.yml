name: Build Windows Release EXE
# Release trigger: latest Excel styling release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-validation-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Run tests on Windows
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "명세서대사" app.py
          Copy-Item "dist/명세서대사.exe" "dist/statement-reconciliation.exe"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/statement-reconciliation.exe"
          if (-not (Test-Path $exe)) {
            throw "Release EXE was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "Release EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built $exe ($size bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: statement-reconciliation-windows
          path: dist/statement-reconciliation.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "download-latest"
          $asset = "dist/statement-reconciliation.exe"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title "명세서 대사 최신 버전" --notes "Windows 실행파일 최신 배포본입니다. Build: $env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $asset --target "$env:GITHUB_SHA" --title "명세서 대사 최신 버전" --notes "Windows 실행파일 최신 배포본입니다. Build: $env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
          }
